# Profilo successivo alla prova. Richiede dominio, HTTPS e instradamento concordati.
# Avvio esplicito: docker compose -f compose.yaml -f compose.https.yaml up -d --build
services:
  api:
    ports: !override
      - '127.0.0.1:8001:8000'
    environment:
      APP_ORIGINS: https://${TELEDERM_DOMAIN:?Configurare il dominio autorizzato}
      COOKIE_SECURE: 'true'
      HTTP_DEMO_ORIGINS: ''
  worker:
    environment:
      APP_ORIGINS: https://${TELEDERM_DOMAIN:?Configurare il dominio autorizzato}
      COOKIE_SECURE: 'true'
      HTTP_DEMO_ORIGINS: ''
  migrate:
    environment:
      APP_ORIGINS: https://${TELEDERM_DOMAIN:?Configurare il dominio autorizzato}
      COOKIE_SECURE: 'true'
      HTTP_DEMO_ORIGINS: ''
  gateway:
    image: caddy:2
    restart: unless-stopped
    environment:
      TELEDERM_DOMAIN: ${TELEDERM_DOMAIN:?Configurare il dominio autorizzato}
      ACME_EMAIL: ${ACME_EMAIL:?Configurare il contatto per il certificato}
    ports:
      - '${HTTPS_BIND_IP:-192.168.50.10}:8000:80'
      - '${HTTPS_BIND_IP:-192.168.50.10}:8443:443'
    volumes:
      - ./ops/Caddyfile:/etc/caddy/Caddyfile:ro
      - certificates:/data
      - gateway_config:/config
    depends_on:
      api:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
volumes:
  certificates:
  gateway_config:
