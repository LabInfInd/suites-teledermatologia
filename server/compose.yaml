name: telederm

x-application: &application
  image: telederm-app:local
  build: .
  environment: &application-environment
    DATABASE_URL: postgresql+psycopg://telederm:${POSTGRES_PASSWORD:?Eseguire prima python3 scripts/configure_vm.py}@db:5432/telederm
    DATA_DIR: /data
    APP_ORIGINS: ${APP_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
    COOKIE_SECURE: ${COOKIE_SECURE:-false}
    HTTP_DEMO_ORIGINS: ${HTTP_DEMO_ORIGINS:-}
    SESSION_HOURS: ${SESSION_HOURS:-8}
    MODEL_ADAPTER: ${MODEL_ADAPTER:-disabled}
    MODEL_DIR: /models
    MODEL_THREADS: ${MODEL_THREADS:-4}
    MODEL_CATALOG_FILE: ${MODEL_CATALOG_FILE:-}
    NO_ALBUMENTATIONS_UPDATE: '1'
  volumes:
    - images:/data
    - ./model_integration/weights:/models:ro
  init: true
  security_opt:
    - no-new-privileges:true
  cap_drop: [ALL]
  read_only: true
  tmpfs:
    - /tmp:size=128m,mode=1777
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: '3'

services:
  db:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: telederm
      POSTGRES_DB: telederm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configurazione mancante}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U telederm -d telederm']
      interval: 5s
      timeout: 5s
      retries: 12
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  migrate:
    <<: *application
    command: [python, -m, alembic, upgrade, head]
    restart: 'no'
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *application
    restart: unless-stopped
    ports:
      - '${HOST_BIND:-127.0.0.1}:${APP_PORT:-8001}:8000'
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s

  worker:
    <<: *application
    environment:
      <<: *application-environment
      WORKER_READY_FILE: /tmp/telederm-worker.ready
    command: [python, -m, app.worker]
    restart: unless-stopped
    stop_grace_period: 60s
    healthcheck:
      test: [CMD, python, -c, "from pathlib import Path; assert Path('/tmp/telederm-worker.ready').is_file()"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 60s
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  database:
  images:
